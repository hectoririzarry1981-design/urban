<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GAD — Escuela de Adiestramiento</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-view="login">

  <!-- ══════════════════════════════════════════
       VIEW: LOGIN
  ══════════════════════════════════════════ -->
  <div id="view-login" class="view-panel">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-icon">🎓</span>
        <h1>GAD Adiestramiento</h1>
        <p>Sistema de Gestión de Equipos</p>
      </div>

      <form id="form-login">
        <div class="form-group">
          <label for="input-email">Correo electrónico</label>
          <input id="input-email" type="email" placeholder="tu@correo.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="input-password">Contraseña</label>
          <input id="input-password" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <p id="login-error" class="error-msg"></p>
        <button id="btn-login" type="submit" class="btn btn-primary btn-full">
          Iniciar sesión
        </button>
      </form>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       VIEW: DASHBOARD (all authenticated views)
  ══════════════════════════════════════════ -->
  <div id="view-dashboard" class="view-panel">

    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <span class="brand-icon">🎓</span>
        <span>GAD Adiestramiento</span>
      </div>

      <nav class="nav-pills" id="main-nav">
        <!-- Injected by ui.js based on role -->
      </nav>

      <div class="header-right">
        <div class="user-info" id="user-info">
          <!-- Injected by ui.js -->
        </div>
        <button id="btn-logout" class="btn btn-secondary">Salir</button>
      </div>
    </header>

    <!-- Main scrollable area -->
    <main id="main-content">
      <!-- Injected by app.js / ui.js on navigation -->
    </main>
  </div>

  <!-- ══════════════════════════════════════════
       LOADER OVERLAY
  ══════════════════════════════════════════ -->
  <div id="loader-overlay">
    <div class="spinner"></div>
  </div>

  <!-- ══════════════════════════════════════════
       TOAST CONTAINER
  ══════════════════════════════════════════ -->
  <div id="toasts" aria-live="polite"></div>

  <!-- ══════════════════════════════════════════
       SCRIPTS (ES Modules)
  ══════════════════════════════════════════ -->
  <script type="module" src="app.js"></script>
</body>
</html>
