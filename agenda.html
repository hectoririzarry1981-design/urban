<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="App de Agendas y Planes de Trabajo Diarios — A.G.A, A.D.A, G.A.D">
  <meta name="theme-color" content="#38bdf8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agenda Diaria">
  <title>Agenda Diaria — Adiestramiento</title>
  <link rel="stylesheet" href="agenda-styles.css">
  <link rel="manifest" href="agenda-manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
</head>
<body>
  <div id="app"></div>

  <script src="agenda-config.js"></script>
  <script src="agenda-app.js"></script>
  <script src="agenda-ui.js"></script>
  <script>
    // Registrar Service Worker para PWA offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./agenda-sw.js')
          .catch(() => {}); // Silencioso si falla
      });
    }
  </script>
</body>
</html>
